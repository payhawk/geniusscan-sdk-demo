name: ReactNative

on: push

defaults:
  run:
    working-directory: react-native-genius-scan-demo

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - name: set up JDK
      uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2
      with:
        distribution: 'zulu'
        java-version: 11
    - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
    - run: npm install
    - run: cd android && ./gradlew assembleRelease
  ios:
    runs-on: macos-12
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
    - run: npm install
    - run: cd ios && pod install
    - run: cd ios && xcodebuild archive -workspace demo.xcworkspace -scheme demo CODE_SIGNING_ALLOWED=NO
