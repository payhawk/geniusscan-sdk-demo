name: Android

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1
    - name: set up JDK
      uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2
      with:
        distribution: 'zulu'
        java-version: 11
    - run: ./gradlew assembleRelease

