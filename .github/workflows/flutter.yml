name: Flutter

on: push

defaults:
  run:
    working-directory: flutter-plugin-genius-scan-demo

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1
      with:
        java-version: '12.x'
    - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1
      with:
        flutter-version: '2.x'
    - run: flutter pub get
    - run: flutter build apk
  ios:
    runs-on: macos-12
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1
      with:
        flutter-version: '2.x'
    - run: flutter pub get
    - run: flutter build ios --release --no-codesign
